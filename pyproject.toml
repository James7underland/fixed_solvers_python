[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-solvers"
version = "1.0.0"
description = "Newton–Raphson, bisection and Gauss–Newton solvers of fixed and variable dimension (Python port of fixed_solvers)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "fixed_solvers authors" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "ruff>=0.6",
    "build>=1.0",
]

[tool.setuptools.packages.find]
include = ["fixed_solvers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["fixed_solvers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E731",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"fixed_solvers/__init__.py" = ["F401"]
"fixed_solvers/**/__init__.py" = ["F401"]

[tool.coverage.run]
source = ["fixed_solvers"]
branch = true

[tool.coverage.report]
omit = ["fixed_solvers/**/__init__.py"]
